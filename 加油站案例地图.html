<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国加油站偷税案例地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.chinatms/1.0.1/leaflet.ChinaTms.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
body{background:#f5f5f5}
.header{background:linear-gradient(135deg,#c44e52,#8b1a1a);color:#fff;padding:18px 24px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:20px} .header .sub{font-size:12px;opacity:.7;margin-top:3px}
#map{width:100%;height:calc(100vh - 78px)}
.info{position:absolute;bottom:30px;left:30px;z-index:1000;background:rgba(255,255,255,.95);padding:14px 18px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;line-height:2;min-width:160px;backdrop-filter:blur(4px)}
.info i{width:14px;height:14px;display:inline-block;border-radius:50%;margin-right:8px;vertical-align:middle}
.info b{font-size:14px}
.leaflet-popup-content-wrapper{border-radius:8px;font-size:13px;line-height:1.7}
.leaflet-popup-content b{color:#1a1a2e}
</style>
</head>
<body>
<div class="header">
<h1>⛽ 全国加油站偷税案例分布地图</h1>
<div class="sub">21 个案例 · 国家税务总局税案通报 · 2021—2026 · 高德地图</div>
</div>
<div id="map"></div>
<div class="info">
<b>🔍 违法手法</b><br>
<i style="background:#d93025"></i>私户收款/POS机<br>
<i style="background:#e37400"></i>作弊主板/两套系统<br>
<i style="background:#1967d2"></i>骗取留抵退税<br>
<i style="background:#137333"></i>消费税逃逸<br>
<i style="background:#7b1fa2"></i>虚开发票<br>
<span style="font-size:11px;color:#999">点击标记查看详情</span>
</div>
<script>
var map = L.map('map').setView([34, 110], 5);

// Use AMap tiles (works well in China, no API key needed for basic tiles)
L.tileLayer('https://webrd0{ Math.floor(Math.random()*4) }.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  attribution: '&copy; 高德地图',
  subdomains: '0123',
  maxZoom: 18
}).addTo(map);

var markers = [
{lat:35.50,lng:112.85,method:'私户收款',color:'#d93025',date:'2026-05-22',loc:'山西晋城',desc:'泽州县郊南加油站隐匿收入偷税',amt:'174.20万'},
{lat:21.66,lng:110.93,method:'消费税',color:'#137333',date:'2026-04-17',loc:'广东茂名',desc:'茂名市宏坚石化偷逃消费税',amt:'227.32万'},
{lat:40.19,lng:117.97,method:'骗留抵退税',color:'#1967d2',date:'2025-11-17',loc:'河北遵化',desc:'遵化千里行加油加气站骗留抵退税',amt:''},
{lat:44.53,lng:125.70,method:'作弊主板',color:'#e37400',date:'2025-09-28',loc:'吉林德惠',desc:'德惠天赐加油站隐匿收入偷税',amt:''},
{lat:36.33,lng:113.23,method:'私户收款',color:'#d93025',date:'2025-09-28',loc:'山西长治',desc:'潞城雨田实业加油站账外隐匿收入',amt:''},
{lat:32.51,lng:120.15,method:'私户收款',color:'#d93025',date:'2025-09-28',loc:'江苏泰州',desc:'泰州姜堰胜利加油站隐匿收入',amt:''},
{lat:29.71,lng:115.99,method:'私户收款',color:'#d93025',date:'2025-09-28',loc:'江西九江',desc:'九江浔西能源经开区加油站偷税',amt:''},
{lat:22.77,lng:111.57,method:'作弊主板',color:'#e37400',date:'2025-02-10',loc:'广东云浮',desc:'罗定大众石油经营偷逃税',amt:''},
{lat:39.86,lng:79.13,method:'作弊主板',color:'#e37400',date:'2025-02-10',loc:'新疆图木舒克',desc:'东城迎宾加油加气站作弊主板偷税',amt:''},
{lat:24.05,lng:104.19,method:'私户收款',color:'#d93025',date:'2025-02-10',loc:'云南文山',desc:'丘北树皮岔路加油站隐匿收入',amt:''},
{lat:35.90,lng:114.30,method:'私户收款',color:'#d93025',date:'2024-10-17',loc:'河南鹤壁',desc:'鹤壁加油站偷税案件',amt:''},
{lat:22.65,lng:110.16,method:'私户收款',color:'#d93025',date:'2024-05-31',loc:'广西玉林',desc:'广西加油站偷税案件',amt:''},
{lat:26.65,lng:106.63,method:'私户收款',color:'#d93025',date:'2024-02-29',loc:'贵州',desc:'贵州加油站偷税案件',amt:''},
{lat:36.07,lng:118.38,method:'消费税',color:'#137333',date:'2024-01-12',loc:'山东',desc:'山东成品油生产企业偷税',amt:'25200.00万'},
{lat:36.07,lng:120.38,method:'私户收款',color:'#d93025',date:'2023-07-28',loc:'山东青岛',desc:'青岛加油站偷税案件',amt:''},
{lat:41.27,lng:123.24,method:'私户收款',color:'#d93025',date:'2023-06-28',loc:'辽宁辽阳',desc:'辽阳加油站偷税案件',amt:''},
{lat:29.87,lng:121.54,method:'私户收款',color:'#d93025',date:'2023-06-28',loc:'浙江宁波',desc:'宁波加油站偷税案件',amt:''},
{lat:38.30,lng:116.85,method:'私户收款',color:'#d93025',date:'2023-04-26',loc:'河北沧州',desc:'沧州加油站偷税案件',amt:''},
{lat:39.13,lng:117.20,method:'虚开发票',color:'#7b1fa2',date:'2023-03-16',loc:'天津',desc:'天津加油站虚开增值税发票',amt:''},
{lat:28.66,lng:121.42,method:'私户收款',color:'#d93025',date:'2023-03-16',loc:'浙江台州',desc:'台州加油站偷税案件',amt:''},
{lat:28.55,lng:112.36,method:'私户收款',color:'#d93025',date:'2023-01-31',loc:'湖南益阳',desc:'益阳加油站偷税案件',amt:''},
];

markers.forEach(function(m) {
  var icon = L.divIcon({
    className: '',
    html: '<div style="width:18px;height:18px;background:'+m.color+';border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>',
    iconSize: [18,18],
    iconAnchor: [9,9]
  });
  var popup = '<b>'+m.loc+'</b><br>'+m.date+'<br>'+m.desc+'<br><b>手法：</b>'+m.method+(m.amt?'<br><b>金额：</b>'+m.amt:'');
  L.marker([m.lat, m.lng], {icon:icon})
    .addTo(map)
    .bindPopup(popup);
});

if (markers.length > 0) {
  var group = L.featureGroup(markers.map(function(m) {return L.marker([m.lat, m.lng])}));
  map.fitBounds(group.getBounds().pad(0.12));
}
</script>
</body>
</html>
